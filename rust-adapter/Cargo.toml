[package]
name = "access-control-system"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio-modbus = "*"
thiserror = "2.0.18"
serde_json= "1.0"
tokio-util= { version = "0.7", features = ["codec"] }
bytes= "1.11.1"
anyhow="1.0.101"
chrono ="0.4"
http-client = "6.5.3"
rust-ethernet-ip = "0.6.2"
windows-service = "0.8.0"
jsonwebtoken = "10.3.0"
warp = { version = "0.4.2", features = ["websocket", "server"] }
pyo3 = { version = "0.28.1", features = ["auto-initialize"] }

rmodbus = "0.12.2"
[dependencies.ldap3]
version = "0.12.1"

[target.'cfg(unix)'.dependencies]
serialport = "4.8.1"
