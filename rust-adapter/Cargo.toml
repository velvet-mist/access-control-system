[package]
name = "access-control-system"
version = "0.1.0"
edition = "2021"

[features]
default = []
embedded-python = ["dep:pyo3"]

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio-modbus = "*"
thiserror = "2.0.18"
serde_json= "1.0"
tokio-util= { version = "0.7", features = ["codec"] }
bytes= "1.11.1"
anyhow="1.0.102"
chrono ="0.4.44"
dotenvy = "0.15.7"
http-client = "6.5.3"
rust-ethernet-ip = "0.6.3"
windows-service = "0.8.0"
jsonwebtoken = "10.3.0"
warp = { version = "0.4.2", features = ["websocket", "server"] }
pyo3 = { version = "0.28.2", features = ["auto-initialize"], optional = true }
telnet = "0.2.4"
rmodbus = "0.12.2"
[dependencies.ldap3]
version = "0.12.1"

[target.'cfg(unix)'.dependencies]
serialport = "4.8.1"
