version: "3.8"

services:
  db:
      image: postgres:15
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: access_control
      ports:
        - "5432:5432"
  api:
    build:
      context: .
      dockerfile: controller/Dockerfile
    ports:
      - "8000:8000"


  adapter:
    build: ./rust-adapter
    depends_on:
      - api
