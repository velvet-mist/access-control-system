services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: access_control
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d access_control"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: controller/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: access_control
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 10s
      timeout: 5s
      retries: 8

  adapter:
    build:
      context: ./rust-adapter
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://api:8000
      ADAPTER_TOKEN: done
      OVERRIDE_TOKEN: override-token
      OVERRIDE_PASSCODE: "1234"
      MACHINE_ID: MACHINE_1
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      PLC_TYPE: keyence
      PLC_PORT: /dev/ttyUSB0
      PLC_BAUDRATE: 9600
      PLC_SLAVE_ADDR: 1
      PLC_REGISTER_ALLOW: 100
      PLC_REGISTER_DENY: 101
      COGNEX_HOST: 127.0.0.1
      COGNEX_PORT: 23
      COGNEX_ALLOW_COMMAND: ALLOW
      COGNEX_DENY_COMMAND: DENY
      COGNEX_RESET_COMMAND: RESET
      RUN_EMBEDDED_PYTHON: "false"
      PYTHON_MODULE: controller.main
      PYTHON_FUNCTION: start_application
    ports:
      - "8080:8080"
    # Uncomment on Linux host with a connected PLC device.
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 8
